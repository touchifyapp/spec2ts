name: Release

# Publishes packages whose version in package.json is not yet on npm.
# Versions are bumped locally with `npm run release` and merged through a PR (see CONTRIBUTING.md).
# Publishing uses npm trusted publishing (OIDC): no npm token is stored in the repository.

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Check unpublished versions
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.check.outputs.packages }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: List unpublished versions
        id: check
        run: |
          unpublished=""
          for manifest in packages/*/package.json; do
            name=$(node -p "require('./$manifest').name")
            version=$(node -p "require('./$manifest').version")
            if [ -z "$(npm view "$name@$version" version 2>/dev/null)" ]; then
              echo "::notice::$name@$version is not published yet"
              unpublished="$unpublished $name@$version"
            fi
          done
          echo "packages=$(echo $unpublished)" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish to npm
    needs: check
    if: needs.check.outputs.packages != ''
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write # push release tags
      id-token: write # npm trusted publishing (OIDC) and provenance

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Install Dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Publish packages
        run: npx lerna publish from-package --yes

      - name: Tag published versions
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags --quiet

          for manifest in packages/*/package.json; do
            name=$(node -p "require('./$manifest').name")
            version=$(node -p "require('./$manifest').version")
            tag="$name@$version"

            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              continue
            fi

            # retry a few times: a freshly published version can take a few seconds to appear on the registry
            for attempt in 1 2 3 4 5; do
              if [ -n "$(npm view "$tag" version 2>/dev/null)" ]; then
                git tag -a "$tag" -m "$tag"
                git push origin "refs/tags/$tag"
                echo "::notice::Tagged $tag"
                break
              fi
              sleep 5
            done
          done
